[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prc"
version = "0.1.0"
description = "Real-time AI/ML training observability, diagnosis, and forecasting platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["machine-learning", "deep-learning", "observability", "training", "pytorch", "tensorflow", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/prc"
Repository = "https://github.com/YOUR_USERNAME/prc"
Issues = "https://github.com/YOUR_USERNAME/prc/issues"

[project.optional-dependencies]
pytorch = ["torch"]
tensorflow = ["tensorflow"]
tunnel = ["pyngrok"]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23"]
all = ["torch", "tensorflow", "pyngrok"]

[tool.setuptools]
packages = ["prc_sdk", "server", "storage", "analytics", "forecasting", "assistant"]

[tool.setuptools.package-dir]
prc_sdk = "sdk/prc_sdk"
server = "server"
storage = "storage"
analytics = "analytics"
forecasting = "forecasting"
assistant = "assistant"
